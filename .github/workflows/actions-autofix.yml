name: Actions autofix

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.8"
          module: .dagger
          call: --gh-auth-token=env://GITHUB_TOKEN autofix export --path=.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open or update a PR if autofix changed anything
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: actions-autofix
          delete-branch: true
          commit-message: "Apply zizmor/actions-up autofix"
          title: "Apply zizmor/actions-up autofix"
          body: |
            Automated: `dagger call autofix` found pending GitHub Actions/security
            fixes and applied them. Runs daily, ahead of Renovate's own schedule, so
            Renovate's GitHub Actions PRs only need to step in for whatever this
            doesn't catch.
