site_name: envoke
site_description: Run shell scripts when you cd into or out of a directory.
site_url: https://neirda24.github.io/envoke/
repo_url: https://github.com/Neirda24/envoke
repo_name: Neirda24/envoke
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit
    # Keeps the per-shell tabs on a page in step with each other: pick "fish"
    # once and every other tabbed block on the page follows.
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

# An .md file that is absent from the nav still builds and publishes at its own
# URL; MkDocs only logs it at INFO, which --strict ignores. Raising it to a
# warning is what stops a draft, a handoff or a contributor note dropped into
# docs/ from going online unnoticed.
#
# The link checks are the same idea one level down: a `[…](page.md#section)`
# whose heading has been renamed still builds, and --strict is what turns the
# dangling anchor into a failed build rather than a link a reader finds first.
validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Start here:
      - Getting Started: getting-started.md
      - Configuration: configuration.md
      - Recipes: recipes.md
  - Guides:
      - Trust Model: trust.md
      - Inspecting and switching off: debugging.md
      - Non-interactive Use: non-interactive.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - CLI Reference: reference.md
      - envoke vs. direnv: vs-direnv.md
      - Design Notes: design-notes.md
      - Uninstalling: uninstall.md
  - Contributing: contributing.md
