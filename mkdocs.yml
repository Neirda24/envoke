site_name: envoke
site_description: Run shell scripts when you cd into or out of a directory.
site_url: https://neirda24.github.io/envoke/
repo_url: https://github.com/Neirda24/envoke
repo_name: Neirda24/envoke
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - envoke vs. direnv: vs-direnv.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Trust Model: trust.md
  - Non-interactive Use: non-interactive.md
  - Debugging: debugging.md
  - Reference: reference.md
  - Uninstalling: uninstall.md
  - Design Notes: design-notes.md
  - Contributing: contributing.md
