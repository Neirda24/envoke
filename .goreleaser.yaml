version: 2

project_name: envoke

builds:
  - id: envoke
    main: ./cmd/envoke
    binary: envoke
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strip debug info (smaller release binaries; appropriate here
    # since this build is release-only, not a dev build). -X injects the
    # main.version/commit/date vars cmd/envoke/main.go declares specifically
    # for this purpose -- without this block every release binary printed
    # "envoke dev" regardless of the actual tag, since those vars otherwise
    # keep their zero-value defaults.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: envoke
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# .deb/.rpm packages for Linux, built by the nfpm packager nfpm ships bundled
# inside the goreleaser Docker image already used to run this whole config.
# goreleaser only feeds nfpm the linux/{amd64,arm64} artifacts from the
# `envoke` build above -- darwin/windows binaries are skipped automatically
# since a deb/rpm doesn't make sense for either. These are release assets
# only (attached to the GitHub Release, included in checksums.txt below),
# not a hosted apt/yum repository -- installing means downloading the
# package manually and running dpkg/rpm, same as the manual-download path
# in release.footer.
nfpms:
  - id: envoke
    package_name: envoke
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Neirda24
    homepage: "https://github.com/Neirda24/envoke"
    maintainer: "Adrien Roches <adrien@roc-it.tech>"
    description: "Runs shell scripts when you cd into or out of a directory"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

# An SPDX 2.3 JSON SBOM per archive (goreleaser's default syft output),
# generated by syft -- which, like nfpm and cosign, already ships inside the
# goreleaser Docker image this config runs in (confirmed: `syft version`
# reports 1.45.1 there), so this adds no new tool to install or pin.
#
# For a zero-dependency static Go binary an SBOM is close to a formality: it
# will list the Go toolchain and the stdlib and nothing else, which is
# precisely the point. It gives downstream consumers a machine-readable way
# to confirm that -- and to keep confirming it release after release -- via
# whatever vulnerability scanner they already run, rather than taking the
# README's word for it. The day a dependency does creep in, the SBOM says so
# without anyone having to notice.
#
# `artifacts: archive` emits one SBOM per archive rather than one for the
# whole release, so each is scoped to the exact binary a user downloaded.
# They're attached to the GitHub Release and hashed in checksums.txt below,
# which cosign then signs -- so the SBOMs inherit the same signed chain as
# every other artifact.
sboms:
  - id: archive
    artifacts: archive

checksum:
  name_template: "checksums.txt"

# Keyless (Sigstore/Fulcio OIDC) signing of checksums.txt via cosign, which
# ships inside the goreleaser/goreleaser Docker image already used to run
# this whole config (confirmed: `cosign version` succeeds in that image).
# Signing checksums.txt is sufficient — every other release artifact is
# already covered because checksums.txt itself hashes them all. Requires
# `id-token: write` on the GitHub Actions job (release.yml) and the
# ACTIONS_ID_TOKEN_REQUEST_URL/ACTIONS_ID_TOKEN_REQUEST_TOKEN env vars to
# reach the container cosign runs in (see .dagger/main.go's Publish
# function) — cosign's GitHub Actions ambient-credential detection reads
# those to mint a short-lived OIDC identity, no key material stored
# anywhere. `--yes` skips the interactive confirmation prompt that
# publishing to the public Rekor transparency log would otherwise require.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: Neirda24
    name: envoke
  footer: |
    ## Install / upgrade

    - **Homebrew** (macOS/Linux): `brew install neirda24/tap/envoke`, or `brew upgrade envoke` if already installed.
    - **Scoop** (Windows): `scoop bucket add neirda24 https://github.com/Neirda24/scoop-bucket`, then `scoop install envoke`, or `scoop update envoke` if already installed.
    - **Debian/Ubuntu**: download the `.deb` from the Assets above and `sudo dpkg -i envoke_*.deb`.
    - **Fedora/RHEL**: download the `.rpm` from the Assets above and `sudo rpm -i envoke_*.rpm`.
    - **Manual download**: grab the archive for your OS/arch from the Assets above, extract it, and put `envoke` on your `PATH`. Verify against `checksums.txt`.
    - **Go toolchain**: `go install github.com/Neirda24/envoke/cmd/envoke@{{ .Tag }}`

    ## Verifying releases

    Each archive ships an SPDX SBOM alongside it (`*.sbom.json`), generated by [syft](https://github.com/anchore/syft) and hashed in `checksums.txt` like every other asset — so it inherits the signature below.

    `checksums.txt` is signed keylessly with [cosign](https://docs.sigstore.dev/cosign/) via GitHub Actions OIDC (Sigstore/Fulcio) — no long-lived signing key exists. `checksums.txt.sigstore.json` (in Assets above) bundles the signature, signing certificate, and Rekor transparency-log entry. Verify with:

    ```sh
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp "^https://github\.com/Neirda24/envoke/\.github/workflows/release\.yml@.*$" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    A successful verification proves `checksums.txt` (and, transitively, every archive it hashes) was built and signed by this repository's own `release.yml` workflow, not tampered with in transit.

homebrew_casks:
  - name: envoke
    binaries: [envoke]
    repository:
      owner: Neirda24
      name: homebrew-tap
      # Deliberately not GITHUB_TOKEN (the default this would otherwise
      # inherit) -- that's scoped to envoke only. This push needs a
      # separate, narrower credential with write access to homebrew-tap
      # (and, since this same token is reused below for scoops.repository,
      # scoop-bucket) specifically: a short-lived GitHub App installation
      # token minted per run (see .dagger/main.go's Publish and
      # security_audit.md's Finding 6 for why this replaced a long-lived
      # cross-repo PAT).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/Neirda24/envoke"
    description: "Runs shell scripts when you cd into or out of a directory"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envoke"]
          end

scoops:
  - name: envoke
    repository:
      owner: Neirda24
      name: scoop-bucket
      # Same GitHub App installation token as homebrew_casks.repository
      # above, just scoped to an additional repo (scoop-bucket) rather than
      # a second App/secret -- see that block's comment for the full
      # rationale on why this isn't the ambient GITHUB_TOKEN.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/Neirda24/envoke"
    description: "Runs shell scripts when you cd into or out of a directory"
    license: MIT
