version: 2

project_name: envoke

builds:
  - id: envoke
    main: ./cmd/envoke
    binary: envoke
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: envoke
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Neirda24
    name: envoke

brews:
  - name: envoke
    repository:
      owner: Neirda24
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/Neirda24/envoke"
    description: "Runs shell scripts when you cd into or out of a directory"
    license: "MIT"
    install: |
      bin.install "envoke"
    test: |
      system "#{bin}/envoke", "version"
