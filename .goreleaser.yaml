version: 2

project_name: envoke

builds:
  - id: envoke
    main: ./cmd/envoke
    binary: envoke
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: envoke
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Neirda24
    name: envoke

homebrew_casks:
  - name: envoke
    binaries: [envoke]
    repository:
      owner: Neirda24
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/Neirda24/envoke"
    description: "Runs shell scripts when you cd into or out of a directory"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envoke"]
          end
